spring.application.name=prm.project-base
server.port=${SERVER_PORT:5001}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prm_project?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

file.upload-dir=${FILE_UPLOAD_DIR:./upload}
file.base-url=${APP_BASE_URL:http://localhost:5001}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

jwt.secret-key=${JWT_SECRET_KEY:c2VjdXJpdHktYmFzZS1wcm9qZWN0LXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLXByb2R1Y3Rpb24tZ3JhZGU=}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.file.name=${LOG_FILE:project-base.log}
logging.level.root=${LOG_LEVEL_ROOT:info}
logging.level.prm.projectbase=${LOG_LEVEL_APP:debug}

storage.active-service=${STORAGE_SERVICE:local}
storage.local.upload-dir=${FILE_UPLOAD_DIR:./upload}
storage.local.base-url=${APP_BASE_URL:http://localhost:5001}
